<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="M4A Maker" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
  <title>YouTube → M4A</title>
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <span class="eyebrow">M4A MAKER</span>
      <h1>YouTube → M4A</h1>
      <p>URLを貼るだけ。タイトル・アーティスト・ジャケットを整えてM4Aに。</p>
    </section>

    <section class="card input-card">
      <label for="url">YouTube URL</label>
      <div class="url-row">
        <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://youtu.be/..." />
        <button id="pasteBtn" class="secondary" type="button">貼り付け</button>
      </div>
      <button id="fetchBtn" class="primary" type="button">動画情報を取得</button>
    </section>

    <section id="editor" class="card editor hidden">
      <div class="art-wrap">
        <img id="artwork" alt="ジャケット" />
      </div>

      <div class="fields">
        <label for="title">タイトル</label>
        <input id="title" type="text" maxlength="300" />

        <label for="artist">アーティスト</label>
        <input id="artist" type="text" maxlength="300" />

        <button id="downloadBtn" class="primary download" type="button">M4Aを作成してダウンロード</button>
      </div>
    </section>

    <section id="status" class="status hidden" aria-live="polite"></section>

    <p class="footnote">自分が権利を持つ、またはダウンロードが許可されたコンテンツで使用してください。</p>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
